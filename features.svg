<svg xmlns="http://www.w3.org/2000/svg" width="800" height="356" viewBox="0 0 800 356" font-family="'Segoe UI', Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e17"/><stop offset="1" stop-color="#0d0410"/></linearGradient><linearGradient id="bd" x1="0" x2="1"><stop offset="0" stop-color="#ff3b4e"/><stop offset="1" stop-color="#ffb020"/></linearGradient><radialGradient id="gl" cx="0.5" cy="0" r="0.9"><stop offset="0" stop-color="#ff3b4e" stop-opacity="0.22"/><stop offset="1" stop-color="#ff3b4e" stop-opacity="0"/></radialGradient></defs><rect x="2" y="2" width="392" height="108" rx="16" fill="#101726" stroke="#ff3b4e" stroke-opacity="0.8" stroke-width="2"/><rect x="2" y="2" width="392" height="108" rx="16" fill="#ff3b4e" fill-opacity="0.05"/><rect x="20" y="28.0" width="56" height="56" rx="14" fill="#ff3b4e" fill-opacity="0.15" stroke="#ff3b4e" stroke-opacity="0.6"/><text x="48" y="67.0" font-size="28" text-anchor="middle">🔑</text><text x="94" y="48" font-size="17" font-weight="700" fill="#eef2f8">Credential Testing</text><text x="94" y="70" font-size="13" fill="#8b96ad">Tries username and password wordlists</text><text x="94" y="88" font-size="13" fill="#8b96ad">against SSH over paramiko</text><rect x="410" y="2" width="392" height="108" rx="16" fill="#101726" stroke="#ffb020" stroke-opacity="0.8" stroke-width="2"/><rect x="410" y="2" width="392" height="108" rx="16" fill="#ffb020" fill-opacity="0.05"/><rect x="428" y="28.0" width="56" height="56" rx="14" fill="#ffb020" fill-opacity="0.15" stroke="#ffb020" stroke-opacity="0.6"/><text x="456" y="67.0" font-size="28" text-anchor="middle">⚡</text><text x="502" y="48" font-size="17" font-weight="700" fill="#eef2f8">Multi-threaded Engine</text><text x="502" y="70" font-size="13" fill="#8b96ad">8 worker threads pull from a shared</text><text x="502" y="88" font-size="13" fill="#8b96ad">password queue for speed</text><rect x="2" y="126" width="392" height="108" rx="16" fill="#101726" stroke="#a855f7" stroke-opacity="0.8" stroke-width="2"/><rect x="2" y="126" width="392" height="108" rx="16" fill="#a855f7" fill-opacity="0.05"/><rect x="20" y="152.0" width="56" height="56" rx="14" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.6"/><text x="48" y="191.0" font-size="28" text-anchor="middle">📡</text><text x="94" y="172" font-size="17" font-weight="700" fill="#eef2f8">Live Results</text><text x="94" y="194" font-size="13" fill="#8b96ad">Successful logins stream to the browser</text><text x="94" y="212" font-size="13" fill="#8b96ad">instantly over WebSockets</text><rect x="410" y="126" width="392" height="108" rx="16" fill="#101726" stroke="#2ee6a6" stroke-opacity="0.8" stroke-width="2"/><rect x="410" y="126" width="392" height="108" rx="16" fill="#2ee6a6" fill-opacity="0.05"/><rect x="428" y="152.0" width="56" height="56" rx="14" fill="#2ee6a6" fill-opacity="0.15" stroke="#2ee6a6" stroke-opacity="0.6"/><text x="456" y="191.0" font-size="28" text-anchor="middle">🧵</text><text x="502" y="172" font-size="17" font-weight="700" fill="#eef2f8">Background Jobs</text><text x="502" y="194" font-size="13" fill="#8b96ad">Scans run as Celery tasks so the</text><text x="502" y="212" font-size="13" fill="#8b96ad">dashboard stays responsive</text><rect x="2" y="250" width="392" height="108" rx="16" fill="#101726" stroke="#3b82f6" stroke-opacity="0.8" stroke-width="2"/><rect x="2" y="250" width="392" height="108" rx="16" fill="#3b82f6" fill-opacity="0.05"/><rect x="20" y="276.0" width="56" height="56" rx="14" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.6"/><text x="48" y="315.0" font-size="28" text-anchor="middle">📊</text><text x="94" y="296" font-size="17" font-weight="700" fill="#eef2f8">Visual Dashboard</text><text x="94" y="318" font-size="13" fill="#8b96ad">Charts and tables summarize scan</text><text x="94" y="336" font-size="13" fill="#8b96ad">activity and history</text><rect x="410" y="250" width="392" height="108" rx="16" fill="#101726" stroke="#ff7a45" stroke-opacity="0.8" stroke-width="2"/><rect x="410" y="250" width="392" height="108" rx="16" fill="#ff7a45" fill-opacity="0.05"/><rect x="428" y="276.0" width="56" height="56" rx="14" fill="#ff7a45" fill-opacity="0.15" stroke="#ff7a45" stroke-opacity="0.6"/><text x="456" y="315.0" font-size="28" text-anchor="middle">🗂️</text><text x="502" y="296" font-size="17" font-weight="700" fill="#eef2f8">Per-host Reports</text><text x="502" y="318" font-size="13" fill="#8b96ad">Each scan is saved as a timestamped JSON</text><text x="502" y="336" font-size="13" fill="#8b96ad">report by target host</text></svg>